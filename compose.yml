services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: hazel-caddy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./agent/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data:rw
      - caddy-config:/config:rw
    env_file:
      - .env
    environment:
      - SEARXNG_HOSTNAME=${SEARXNG_HOSTNAME:-http://localhost}
      - SEARXNG_TLS=${LETSENCRYPT_EMAIL:-internal}
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  agent:
    image: ${NULLCLAW_IMAGE:-ghcr.io/nullclaw/nullclaw:latest}
    container_name: hazel
    restart: unless-stopped
    networks:
      - hazel-net
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    volumes:
      - nullclaw-data:/nullclaw-data
      - ./agent/config.json:/nullclaw-data/config.json:ro
      - ./agent/docs:/nullclaw-data/workspace
      # - ./entrypoint.sh:/entrypoint.sh:ro
    # entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: "gateway"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: hazel-redis
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - hazel-net
    env_file:
      - .env
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: hazel-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - hazel-net
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./agent/searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_HOSTNAME:-http://localhost}/
      - SEARXNG_REAL_IP_HEADER=X-Real-IP
      - SEARXNG_FORWARDED_FOR_HEADER=X-Forwarded-For
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  hazel-net:
    driver: bridge

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  nullclaw-data:
    driver: local
  searxng-data:
    driver: local
  valkey-data:
    driver: local