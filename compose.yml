services:
  agent:
    image: ${NULLCLAW_IMAGE:-ghcr.io/nullclaw/nullclaw:latest}
    container_name: hazel
    restart: unless-stopped
    networks:
      - hazel-net
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    volumes:
      - ./agent/config.json:/nullclaw-data/config.json:ro
      - ./agent/docs:/nullclaw-data/workspace
    command: agent
    stdin_open: true
    tty: true

  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: hazel-redis
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - hazel-net
    env_file:
      - .env
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: hazel-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - hazel-net
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080" # "127.0.0.1:8080:8080"
    volumes:
      - ./agent/searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://hazel-searxng:8080/
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  hazel-net:
    driver: bridge

volumes:
  nullclaw-data:
    driver: local
  searxng-data:
    driver: local
  valkey-data:
    driver: local